<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Be My Girlfriend?</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #050005;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      width: 100vw;
      font-family: "Courier New", monospace;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* Pop-up Window Style */
    #popup {
      position: relative;
      z-index: 10;
      background: #000;
      border: 2px solid #fff;
      box-shadow: 0 0 18px rgba(255, 255, 255, 0.45);
      width: 88%;
      max-width: 340px;
      text-align: center;
    }
    .window-header {
      background: #111;
      border-bottom: 2px solid #fff;
      padding: 8px 10px;
      display: flex;
      justify-content: flex-start;
      gap: 6px;
    }
    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid #fff;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    .window-body {
      padding: 28px 18px;
      color: #fff;
      font-size: 17px;
      line-height: 1.5;
    }
    .buttons {
      padding-bottom: 22px;
      display: flex;
      justify-content: center;
      gap: 18px;
    }
    .btn {
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: "Courier New", monospace;
      touch-action: manipulation;
    }
    .btn:active, .btn:hover {
      background: #fff;
      color: #000;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Pop-up Question Box -->
  <div id="popup">
    <div class="window-header">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
    </div>
    <div class="window-body">
      Do you want to be my girlfriend?
    </div>
    <div class="buttons">
      <button class="btn" id="yesBtn">Yes</button>
      <button class="btn" id="noBtn">No</button>
    </div>
  </div>

  <!-- Matrix & Heart Canvas -->
  <canvas id="canvas" class="hidden"></canvas>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const popup = document.getElementById('popup');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height, columns, drops;
    const chars = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ♡';
    let fontSize = 14;

    // Mobile touch & Desktop hover dekatama "No" button eka panala yanna
    function moveNoButton(e) {
      if (e) e.preventDefault();
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;
      const x = Math.max(padding, Math.random() * maxX);
      const y = Math.max(padding, Math.random() * maxY);

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.zIndex = '20';
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('touchstart', moveNoButton, { passive: false });
    noBtn.addEventListener('click', moveNoButton);

    // "Yes" click kalama animation eka start wenawa
    yesBtn.addEventListener('click', () => {
      popup.classList.add('hidden');
      noBtn.classList.add('hidden');
      canvas.classList.remove('hidden');

      resizeCanvas();
      initMatrix();
      animate(0);
    });

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      fontSize = width < 500 ? 13 : 16;
    }

    window.addEventListener('resize', () => {
      if (!canvas.classList.contains('hidden')) {
        resizeCanvas();
        initMatrix();
      }
    });

    function initMatrix() {
      columns = Math.floor(width / fontSize);
      drops = Array(columns).fill(1).map(() => Math.random() * -50);
    }

    function heartPoint(t, cx, cy, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      return {
        x: cx + x * scale,
        y: cy - y * scale
      };
    }

    function drawCenterpiece(time) {
      const cx = width / 2;
      const cy = height / 2;
      const pulse = 1 + Math.sin(time * 0.004) * 0.05;

      // Screen size ekata galapena widihata Heart saha Text size adjust kirima
      const minDim = Math.min(width, height);
      const baseScale = (minDim / 55) * pulse;
      const textSize = Math.max(28, Math.min(46, Math.floor(width / 9)));
      const textOffsetY = baseScale * 15;
      const heartOffsetY = baseScale * 4;

      ctx.save();
      ctx.shadowColor = '#ff2a85';
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#ffb3d9';

      // "LOVE YOU" Text
      ctx.font = `bold ${textSize}px "Courier New", monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('LOVE YOU', cx, cy - textOffsetY);

      // Heart Shape
      ctx.beginPath();
      for (let t = 0; t <= Math.PI * 2; t += 0.02) {
        const pt = heartPoint(t, cx, cy + heartOffsetY, baseScale);
        if (t === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.closePath();
      ctx.fill();

      // CRT Scanlines
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(10, 0, 10, 0.35)';
      const boxHalfW = Math.min(width / 2, baseScale * 22);
      const topY = cy - textOffsetY - textSize;
      const bottomY = cy + heartOffsetY + baseScale * 18;
      for (let y = topY; y < bottomY; y += 4) {
        ctx.fillRect(cx - boxHalfW, y, boxHalfW * 2, 1.5);
      }

      ctx.restore();
    }

    function animate(time) {
      ctx.fillStyle = 'rgba(5, 0, 5, 0.08)';
      ctx.fillRect(0, 0, width, height);

      ctx.font = `${fontSize}px monospace`;
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillStyle = Math.random() > 0.92 ? '#ff80bf' : '#7a1c4b';
        ctx.fillText(text, x, y);

        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }

      drawCenterpiece(time);
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
