<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Girlfriend?</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050005;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "Courier New", monospace;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* Pop-up Window Style */
    #popup {
      position: relative;
      z-index: 10;
      background: #000;
      border: 2px solid #fff;
      box-shadow: 0 0 15px rgba(255,255,255,0.4);
      width: 320px;
      text-align: center;
      display: block;
    }
    .window-header {
      background: #111;
      border-bottom: 2px solid #fff;
      padding: 6px;
      display: flex;
      justify-content: flex-start;
      gap: 5px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      border: 1px solid #fff;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    .window-body {
      padding: 30px 20px;
      color: #fff;
      font-size: 16px;
      line-height: 1.5;
    }
    .buttons {
      padding-bottom: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    .btn {
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      padding: 6px 20px;
      font-weight: bold;
      cursor: pointer;
      font-family: "Courier New", monospace;
    }
    .btn:hover {
      background: #fff;
      color: #000;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Pop-up Question Box -->
  <div id="popup">
    <div class="window-header">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
    </div>
    <div class="window-body">
      Do you want to be my girlfriend?
    </div>
    <div class="buttons">
      <button class="btn" id="yesBtn">Yes</button>
      <button class="btn" id="noBtn">No</button>
    </div>
  </div>

  <!-- Matrix & Heart Canvas -->
  <canvas id="canvas" class="hidden"></canvas>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const popup = document.getElementById('popup');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height, columns, drops;
    const chars = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ♡';
    const fontSize = 16;

    // "No" button eka click karoth wena wadak (Move wena eka hari click karanna bari wena eka)
    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'absolute';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    // "Yes" button eka click karoth pop-up eka nathi wela Matrix animation eka patan gannawa
    yesBtn.addEventListener('click', () => {
      popup.classList.add('hidden');
      canvas.classList.remove('hidden');
      
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initMatrix();
      animate(0);
    });

    window.addEventListener('resize', () => {
      if (!canvas.classList.contains('hidden')) {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initMatrix();
      }
    });

    function initMatrix() {
      columns = Math.floor(width / fontSize);
      drops = Array(columns).fill(1).map(() => Math.random() * -50);
    }

    function heartPoint(t, cx, cy, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);
      return {
        x: cx + x * scale,
        y: cy - y * scale
      };
    }

    function drawCenterpiece(time) {
      const cx = width / 2;
      const cy = height / 2;
      const pulse = 1 + Math.sin(time * 0.004) * 0.05;

      ctx.save();
      ctx.shadowColor = '#ff2a85';
      ctx.shadowBlur = 25;
      ctx.fillStyle = '#ffb3d9';

      // Text
      ctx.font = 'bold 42px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('LOVE YOU', cx, cy - 110);

      // Heart
      ctx.beginPath();
      const scale = 7.5 * pulse;
      for (let t = 0; t <= Math.PI * 2; t += 0.02) {
        const pt = heartPoint(t, cx, cy + 40, scale);
        if (t === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.closePath();
      ctx.fill();

      // Scanlines
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(10, 0, 10, 0.35)';
      for (let y = cy - 160; y < cy + 180; y += 4) {
        ctx.fillRect(cx - 200, y, 400, 1.5);
      }

      ctx.restore();
    }

    function animate(time) {
      ctx.fillStyle = 'rgba(5, 0, 5, 0.08)';
      ctx.fillRect(0, 0, width, height);

      ctx.font = `${fontSize}px monospace`;
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillStyle = Math.random() > 0.92 ? '#ff80bf' : '#7a1c4b';
        ctx.fillText(text, x, y);

        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }

      drawCenterpiece(time);
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
